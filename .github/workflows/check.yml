name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm check

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: buddy-production
    concurrency:
      group: buddy-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BUDDY_DATABASE_ID: ${{ vars.BUDDY_DATABASE_ID }}
      BUDDY_PHOTOS_BUCKET: ${{ vars.BUDDY_PHOTOS_BUCKET }}
      BUDDY_WORKER_NAME: ${{ vars.BUDDY_WORKER_NAME }}
    steps:
      - name: Require the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA" || { echo 'Deploy the current main commit; this run is stale.'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm --filter origin89-buddy deploy:config
      - name: Migrate, verify catalogues and deploy Buddy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure the organization CLOUDFLARE_API_TOKEN secret.'; exit 1; }
          node apps/buddy/scripts/deploy.mjs
